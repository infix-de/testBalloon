name: 'CI: Publish a snapshot'
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  publish:
    name: 'Publish a snapshot'
    if: github.event.repository.fork == false
    runs-on: macOS-latest

    steps:
      - name: 'Check out the project'
        # https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          gradle-cache-disabled: true

      - name: 'Populate the staging repository'
        run: ./gradlew publishAllPublicationsToAggregationStagingRepository

      - name: 'Publish to Maven Central Snapshots'
        run: ./gradlew :nmcpPublishAggregationToCentralPortalSnapshots
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: 'Obtain the snapshot version'
        run: |
          version="$(awk -F '=' '$1 == "version" { print $2 }' gradle.properties)"
          repo="https://central.sonatype.com/repository/maven-snapshots"
          wget -q -O - "$repo/de/infix/testBalloon/testBalloon-framework-core/$version/maven-metadata.xml" |
          awk -F '[<>]' '$2 == "value" { print("Snapshot version: " $3); exit }'
