name: 'Validate the build'
permissions:
  contents: read

on:
  workflow_call

jobs:
  validate-primary:
    name: 'On primary'
    runs-on: ubuntu-latest

    steps:
      - name: 'Check out the project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: 'false'
          sparse-checkout: |
            /*
            !documentation/website/distribution

      - uses: ./.github/actions/setup
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 'Enable hardware acceleration for Android testing'
        # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 'Check ABI compatibility'
        run: ./gradlew checkLegacyAbi

      - name: 'Check code style consistency'
        run: ./gradlew lintKotlin

      - name: 'Run component tests'
        run: ./gradlew componentTestsAllTargets

      - name: 'Run integration tests'
        run: ./gradlew integrationTests

      - name: 'Upload build reports'
        if: failure()
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports-${{ runner.os }}-${{ github.action }}-${{ github.run_id }}
          path: |
            **/build/reports/
          if-no-files-found: ignore

  validate-secondary:
    name: 'On secondary'
    needs: [ validate-primary ]
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: 'Check out the project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: 'false'
          sparse-checkout: |
            /*
            !documentation/website/distribution

      - uses: ./.github/actions/setup
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 'Check ABI compatibility'
        run: ./gradlew checkLegacyAbi

      - name: 'Run component tests'
        run: ./gradlew componentTestsAllTargets

      - name: 'Run integration tests'
        if: runner.os != 'Windows'
        run: ./gradlew integrationTests
        env:
          TEST_SKIP: 'secondary, Android emulator'

      - name: 'Run integration tests, skip non-ASCII patterns'
        if: runner.os == 'Windows'
        run: ./gradlew integrationTests
        env:
          TEST_SKIP: 'secondary, Android emulator, non-ASCII patterns'

      - name: 'Upload build reports'
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports-${{ runner.os }}-${{ github.action }}-${{ github.run_id }}
          path: |
            **/build/reports/
          if-no-files-found: ignore
