[versions]

# https://developer.android.com/build/releases/gradle-plugin
# https://developer.android.com/studio/releases#android_gradle_plugin_and_android_studio_compatibility
# https://www.jetbrains.com/help/kotlin-multiplatform-dev/multiplatform-compatibility-guide.html#version-compatibility
# The base plugin version used for tests and examples.
android-gradle-plugin = "9.1.0"
# The earliest AGP version used for the TestBalloon Gradle plugin build and integration tests.
android-gradle-plugin-earliest = "8.13.2"
# The latest AGP version used for integration tests.
android-gradle-plugin-latest = "9.2.0"

# https://developer.android.com/build#android_sdk_settings
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"

# https://developer.android.com/jetpack/androidx/versions/all-channel
androidx-test = "1.7.0"

# Target JDK version for the base project.
base-jdk = "8"

# Target JDK version for Gradle plugins.
# https://docs.gradle.org/current/userguide/compatibility.html
gradle-jdk = "17"

# https://github.com/junit-team/junit4/releases
junit-junit4 = "4.13.2"

# https://github.com/gmazzo/gradle-buildconfig-plugin/releases
com-github-gmazzo-buildconfig = "6.0.9"

# https://github.com/GradleUp/nmcp/releases
com-gradleup-nmcp = "1.6.2"

# https://github.com/GradleUp/Tapmoc/releases
com-gradleup-tapmoc = "0.4.2"

# https://github.com/vanniktech/gradle-maven-publish-plugin/releases
com-vanniktech-maven-publish = "0.37.0"

# https://github.com/kotest/kotest/releases
# Do not force an update onto consumers unless necessary
io-kotest = "5.9.1"

# https://github.com/ktorio/ktor/releases
io-ktor = "3.3.3"

# https://github.com/Kotlin/dokka/releases
org-jetbrains-dokka = "2.1.0"

# https://github.com/JetBrains/kotlin/releases
# https://www.jetbrains.com/help/kotlin-multiplatform-dev/multiplatform-compatibility-guide.html#version-compatibility
org-jetbrains-kotlin = "2.2.0"
# The latest Kotlin versions used for integration tests.
org-jetbrains-kotlin-latest-release = "2.4.20"
org-jetbrains-kotlin-latest-prerelease = "2.5.0-dev-6460"
org-jetbrains-kotlin-all-test-releases = "2.5.0-dev-6460;2.4.20-RC3;2.4.0;2.3.21;2.3.0;2.2.21;2.2.0"

# https://github.com/Kotlin/kotlinx.coroutines/releases
org-jetbrains-kotlinx-coroutines = "1.10.2"

# https://github.com/Kotlin/kotlinx-kover/releases
org-jetbrains-kotlinx-kover = "0.9.8"

# https://github.com/jeremymailen/kotlinter-gradle/releases
org-jmailen-kotlinter = "5.4.2"

# https://github.com/junit-team/junit-framework/releases
org-junit-jupiter = "6.0.3"
org-junit-jupiter-jdk = "17"
org-junit-platform = "1.13.4"

# https://github.com/robolectric/robolectric/releases
org-robolectric = "4.16.1"
org-robolectric-jdk = "17"

[libraries]

# https://developer.android.com/develop/ui/compose/bom/bom-mapping
androidx-compose-bom = "androidx.compose:compose-bom:2025.12.00"

androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test" }

androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }

#noinspection SimilarGradleDependency
com-android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin" }

#noinspection SimilarGradleDependency
com-android-gradle-plugin-earliest = { module = "com.android.tools.build:gradle", version.ref = "android-gradle-plugin-earliest" }

# https://github.com/BenWoodworth/Parameterize/releases
com-benwoodworth-parameterize = "com.benwoodworth.parameterize:parameterize-core:0.4.1"

com-github-gmazzo-buildconfig-gradle-plugin = { module = "com.github.gmazzo.buildconfig:com.github.gmazzo.buildconfig.gradle.plugin", version.ref = "com-github-gmazzo-buildconfig" }

com-gradleup-nmcp-aggregation-gradle-plugin = { module = "com.gradleup.nmcp.aggregation:com.gradleup.nmcp.aggregation.gradle.plugin", version.ref = "com-gradleup-nmcp" }
com-gradleup-nmcp-gradle-plugin = { module = "com.gradleup.nmcp:com.gradleup.nmcp.gradle.plugin", version.ref = "com-gradleup-nmcp" }

com-gradleup-tapmoc-gradle-plugin = { module = "com.gradleup.tapmoc:tapmoc-gradle-plugin", version.ref = "com-gradleup-tapmoc" }

com-vanniktech-maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "com-vanniktech-maven-publish" }

# https://github.com/Splitties/refreshVersions/releases
de-fayard-refreshversions-gradle-plugin = "de.fayard.refreshVersions:de.fayard.refreshVersions.gradle.plugin:0.60.6"

# https://github.com/ZacSweers/kotlin-compile-testing/releases
# This kctfork version must be compile-compatible with the minimum Kotlin version specified via "org-jetbrains-kotlin"
# for a minimal set of declarations used in testBalloon-compiler-plugin/base-test.
# kctfork version 0.5.1 provides declarations compatible with Kotlin 2.0.0 and above.
dev-zacsweers-kctfork = "dev.zacsweers.kctfork:core:0.5.1"

# https://github.com/kotest/kotest/releases
io-kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "io-kotest" }

io-ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "io-ktor" }
io-ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "io-ktor" }

# https://github.com/reactor/BlockHound/releases
io-projectreactor-tools-blockhound = "io.projectreactor.tools:blockhound:1.0.14.RELEASE"

# https://github.com/junit-team/junit4
junit-junit4 = { module = "junit:junit", version.ref = "junit-junit4" }

# https://github.com/gradle/foojay-toolchains/blob/main/CHANGELOG.md
org-gradle-toolchains-foojay-resolver = "org.gradle.toolchains:foojay-resolver:1.0.0"

org-jetbrains-dokka-core = { module = "org.jetbrains.dokka:dokka-core", version.ref = "org-jetbrains-dokka" }
org-jetbrains-dokka-base = { module = "org.jetbrains.dokka:dokka-base", version.ref = "org-jetbrains-dokka" }
org-jetbrains-dokka-gradle-plugin = { module = "org.jetbrains.dokka:org.jetbrains.dokka.gradle.plugin", version.ref = "org-jetbrains-dokka" }

org-jetbrains-kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "org-jetbrains-kotlin" }

org-jetbrains-kotlin-android-gradle-plugin = { module = "org.jetbrains.kotlin.android:org.jetbrains.kotlin.android.gradle.plugin", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-assignment-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.assignment:org.jetbrains.kotlin.plugin.assignment.gradle.plugin", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-atomicfu-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.atomicfu:org.jetbrains.kotlin.plugin.atomicfu.gradle.plugin", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "org-jetbrains-kotlin" }
org-jetbrains-kotlin-sam-with-receiver-gradle-plugin = { module = "org.jetbrains.kotlin.plugin.sam.with.receiver:org.jetbrains.kotlin.plugin.sam.with.receiver.gradle.plugin", version.ref = "org-jetbrains-kotlin" }

# https://github.com/Kotlin/kotlinx-atomicfu/releases
org-jetbrains-kotlinx-atomicfu = "org.jetbrains.kotlinx:atomicfu:0.32.1"

org-jetbrains-kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "org-jetbrains-kotlinx-coroutines" }
org-jetbrains-kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "org-jetbrains-kotlinx-coroutines" }
org-jetbrains-kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "org-jetbrains-kotlinx-coroutines" }
org-jetbrains-kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "org-jetbrains-kotlinx-coroutines" }

# https://github.com/Kotlin/kotlinx-datetime/blob/master/CHANGELOG.md
org-jetbrains-kotlinx-kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"
##                                                                           ⬆ :0.7.1-0.6.x-compat"

org-jetbrains-kotlinx-kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "org-jetbrains-kotlinx-kover" }

org-jmailen-kotlinter-gradle-plugin = { module = "org.jmailen.kotlinter:org.jmailen.kotlinter.gradle.plugin", version.ref = "org-jmailen-kotlinter" }

org-junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "org-junit-jupiter" }
org-junit-platform-engine = { module = "org.junit.platform:junit-platform-engine", version.ref = "org-junit-platform" }
org-junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "org-junit-platform" }

org-robolectric = { module = "org.robolectric:robolectric", version.ref = "org-robolectric" }

[plugins]

com-android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }

com-android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }

com-github-gmazzo-buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "com-github-gmazzo-buildconfig" }

com-gradleup-nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "com-gradleup-nmcp" }

com-gradleup-nmcp = { id = "com.gradleup.nmcp", version.ref = "com-gradleup-nmcp" }

com-gradleup-tapmoc = { id = "com.gradleup.tapmoc", version.ref = "com-gradleup-tapmoc" }

com-vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "com-vanniktech-maven-publish" }

org-jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "org-jetbrains-dokka" }

org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "org-jetbrains-kotlin" }

org-jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "org-jetbrains-kotlin" }

org-jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "org-jetbrains-kotlin" }

org-jetbrains-kotlin-plugin-assignment = { id = "org.jetbrains.kotlin.plugin.assignment", version.ref = "org-jetbrains-kotlin" }

org-jetbrains-kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "org-jetbrains-kotlin" }

org-jetbrains-kotlin-plugin-sam-with-receiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "org-jetbrains-kotlin" }

org-jmailen-kotlinter = { id = "org.jmailen.kotlinter", version.ref = "org-jmailen-kotlinter" }
